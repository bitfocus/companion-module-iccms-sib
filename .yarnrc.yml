nodeLinker: node-modules

# Supply-chain policy, mirroring the Bitfocus module template: dependencies may
# not run install scripts, and freshly published versions must age before we
# resolve them. Bitfocus' own packages are exempt from the age gate.
enableScripts: false
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@companion-module/*'
